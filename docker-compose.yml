services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookdock
      POSTGRES_USER: ${HOOKDOCK_DB_USERNAME:-hookdock}
      POSTGRES_PASSWORD: ${HOOKDOCK_DB_PASSWORD:?set HOOKDOCK_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - hookdock-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hookdock"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      HOOKDOCK_DB_URL: jdbc:postgresql://postgres:5432/hookdock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hookdock-pg:
