# Tests run against H2 in PostgreSQL mode so they don't need a database
# running. The Flyway migrations are applied as-is.
spring:
  datasource:
    url: jdbc:h2:mem:hookdock;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

hookdock:
  ingestion:
    max-body-size: 1KB
    redacted-headers:
      - authorization
      - cookie
  destinations:
    # Delivery tests send to a stub server on 127.0.0.1
    allow-private-networks: true
  delivery:
    # Tests drive the worker by calling poll() directly
    poll-interval: PT1H
    request-timeout: PT1S
