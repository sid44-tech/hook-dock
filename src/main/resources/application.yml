spring:
  application:
    name: hookdock
  datasource:
    url: ${HOOKDOCK_DB_URL:jdbc:postgresql://localhost:5432/hookdock}
    username: ${HOOKDOCK_DB_USERNAME:hookdock}
    password: ${HOOKDOCK_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${HOOKDOCK_PORT:8080}

hookdock:
  admin:
    username: ${HOOKDOCK_ADMIN_USERNAME:}
    password: ${HOOKDOCK_ADMIN_PASSWORD:}
  ingestion:
    max-body-size: ${HOOKDOCK_MAX_BODY_SIZE:1MB}
    redacted-headers:
      - authorization
      - proxy-authorization
      - cookie
      - x-api-key
      - x-auth-token
  destinations:
    # Only enable for local development. Allows forwarding to localhost/private IPs.
    allow-private-networks: ${HOOKDOCK_ALLOW_PRIVATE_DESTINATIONS:false}
    allowed-ports: 80,443,8080,8443
  delivery:
    worker-enabled: true
    poll-interval: PT2S
    batch-size: 10
    connect-timeout: 5s
    request-timeout: 15s
