spring:
  application:
    name: hookdock
  datasource:
    # Leave HOOKDOCK_DB_URL unset to use a local H2 file database instead
    # (see hookdock.local-db below).
    url: ${HOOKDOCK_DB_URL:}
    username: ${HOOKDOCK_DB_USERNAME:hookdock}
    password: ${HOOKDOCK_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${HOOKDOCK_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hookdock:
  local-db:
    # Where the H2 file database lives when HOOKDOCK_DB_URL is not set. H2
    # adds ".mv.db" to the name. Relative paths start from the folder the
    # app is started in.
    path: ${HOOKDOCK_LOCAL_DB_PATH:./data/hookdock}
  admin:
    username: ${HOOKDOCK_ADMIN_USERNAME:}
    password: ${HOOKDOCK_ADMIN_PASSWORD:}
  ingestion:
    max-body-size: ${HOOKDOCK_MAX_BODY_SIZE:1MB}
    redacted-headers:
      - authorization
      - proxy-authorization
      - cookie
      - x-api-key
      - x-auth-token
  rate-limit:
    # Per endpoint: at most `requests` accepted in any rolling `period`. Over
    # the limit the endpoint answers 429 with a Retry-After header and stores
    # nothing.
    enabled: ${HOOKDOCK_RATE_LIMIT_ENABLED:true}
    requests: ${HOOKDOCK_RATE_LIMIT_REQUESTS:20}
    period: ${HOOKDOCK_RATE_LIMIT_PERIOD:1m}
  destinations:
    # Only enable for local development. Allows forwarding to localhost/private IPs.
    allow-private-networks: ${HOOKDOCK_ALLOW_PRIVATE_DESTINATIONS:false}
    allowed-ports: 80,443,8080,8443
  delivery:
    worker-enabled: true
    poll-interval: PT2S
    batch-size: 10
    connect-timeout: 5s
    request-timeout: 15s
