<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · HookDock'">HookDock</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand bg-dark navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/projects}">HookDock</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/projects}">Projects</a></li>
        </ul>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-flex align-items-center">
            <span class="navbar-text me-3 small" sec:authentication="name">user</span>
            <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
        </form>
    </div>
</nav>
</body>
</html>
