<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Events')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}">Project</a></li>
            <li class="breadcrumb-item active">Events</li>
        </ol>
    </nav>
    <h1 class="h3 mb-3">Events</h1>

    <table class="table table-sm table-hover" th:if="${!rows.isEmpty()}">
        <thead>
        <tr><th>Received</th><th>Endpoint</th><th>Method</th><th>Provider</th><th>Event ID</th><th>Content type</th><th>Size</th><th>Capture</th><th>Delivery</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td><a th:href="@{/events/{id}(id=${r.event.id})}"
                   th:text="${#temporals.format(r.event.receivedAt, 'yyyy-MM-dd HH:mm:ss')}">time</a></td>
            <td th:text="${r.endpointName}">endpoint</td>
            <td th:text="${r.event.method}">POST</td>
            <td th:text="${r.event.provider} ?: '-'">provider</td>
            <td class="text-truncate" style="max-width: 12rem" th:text="${r.event.providerEventId} ?: '-'">id</td>
            <td th:text="${r.event.contentType} ?: '-'">type</td>
            <td th:text="${r.event.bodySize} + ' B'">0 B</td>
            <td><span class="badge text-bg-info" th:text="${#strings.toLowerCase(r.event.captureStatus)}">captured</span></td>
            <td><span th:replace="~{fragments :: deliveryBadge(${r.latestDelivery})}"></span></td>
        </tr>
        </tbody>
    </table>
    <p th:if="${rows.isEmpty()}" class="text-muted">No events captured yet.</p>

    <nav th:if="${rows.totalPages > 1}" class="d-flex justify-content-between align-items-center small">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${rows.first} ? 'disabled'"
           th:href="@{/projects/{id}/events(id=${project.id}, page=${rows.number - 1})}">&larr; Newer</a>
        <span th:text="'Page ' + ${rows.number + 1} + ' of ' + ${rows.totalPages}
                       + ' (' + ${rows.totalElements} + ' events)'">Page 1 of 1</span>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${rows.last} ? 'disabled'"
           th:href="@{/projects/{id}/events(id=${project.id}, page=${rows.number + 1})}">Older &rarr;</a>
    </nav>
</main>
</body>
</html>
