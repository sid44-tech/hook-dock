<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Events')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}">Project</a></li>
            <li class="breadcrumb-item active">Events</li>
        </ol>
    </nav>
    <h1 class="h3 mb-3">Events</h1>

    <table class="table table-sm table-hover" th:if="${!rows.isEmpty()}">
        <thead>
        <tr><th>Received</th><th>Endpoint</th><th>Method</th><th>Provider</th><th>Event ID</th><th>Content type</th><th>Size</th></tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td><a th:href="@{/events/{id}(id=${r.event.id})}"
                   th:text="${#temporals.format(r.event.receivedAt, 'yyyy-MM-dd HH:mm:ss')}">time</a></td>
            <td th:text="${r.endpointName}">endpoint</td>
            <td th:text="${r.event.method}">POST</td>
            <td th:text="${r.event.provider} ?: '-'">provider</td>
            <td class="text-truncate" style="max-width: 12rem" th:text="${r.event.providerEventId} ?: '-'">id</td>
            <td th:text="${r.event.contentType} ?: '-'">type</td>
            <td th:text="${r.event.bodySize} + ' B'">0 B</td>
        </tr>
        </tbody>
    </table>
    <p th:if="${rows.isEmpty()}" class="text-muted">No events captured yet.</p>
</main>
</body>
</html>
